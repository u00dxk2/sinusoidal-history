notes:
  - >-
    Band collapse: Kondratiev 54y and Perez 55y differ by 0.000337 cycles/year; separating them needs a ~3,000-year record. No verdict text may discriminate the two — every 54y or 55y result is presented as one ~54-55-year band.
  - >-
    HATCH (perez_tech_diffusion) standing caveat: the composite is built from 5-year log-changes, a difference filter with |H(f)|^2 = 4*sin^2(5*pi*f), ~0.32 at f = 1/55. It fails the gate this round (2.87 of 3.0 periods); if future HATCH releases push span past 165y, the transfer function must be disclosed alongside any verdict and the AR null fit on the same filtered object.
  - >-
    dw_nominate_polarization is biennial (one obs per Congress). Cosine regressors use exact calendar years; the AR null is fitted on the observation grid, so its phi is a 2-year autocorrelation.
  - >-
    TFP inference uses the UNSMOOTHED annual dtfp_util (us_tfp_growth_annual.csv). The smoothed display CSV (us_tfp_growth.csv) is banned from inference: the 5-yr MA barely attenuates the 54-55y band but reddens the spectrum and corrupts the AR fit.
  - >-
    AR(1) draws use the exact stationary initial state; AR(2) draws use a 500-step burn-in. AR(1) likelihood is exact (Prais-Winsten); AR(2) likelihood is conditional on the first two observations.
