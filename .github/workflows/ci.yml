name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# No cancel-in-progress: every push to main is a deploy, and each one should keep its own verdict.

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full SHAs: a tag can move, a commit cannot (SIN-R3).
      # src/lib/workflowPins.test.ts enforces it. Resolved 2026-10-05 from v5.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Safe to build in CI: nothing in src/ reads process.env, so a missing key cannot fake a red.
      - run: npm run build
