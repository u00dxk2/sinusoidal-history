name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# No cancel-in-progress: every push to main is a deploy, and each one should keep its own verdict.

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Safe to build in CI: nothing in src/ reads process.env, so a missing key cannot fake a red.
      - run: npm run build
