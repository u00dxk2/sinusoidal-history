name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# No cancel-in-progress: every push to main is a deploy, and each one should keep its own verdict.

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Pinned to full SHAs: a tag can move, a commit cannot (SIN-R3).
      # src/lib/workflowPins.test.ts enforces it. Resolved 2026-10-05 from v5.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      # Dependency audit, added 2026-10-10. Reads package-lock.json against the registry
      # advisory feed, so it needs no install and runs before `npm ci`. Deliberately narrow:
      # runtime dependencies only (--omit=dev), critical severity only. Do not raise it to
      # --audit-level=high: the dev toolchain carries highs with no upstream fix, and a gate
      # that is red on day one gets ignored. Unlike the gates below, this one can go red with
      # no change to the repo: a new critical advisory against a runtime dependency holds the
      # deploy until the lockfile is bumped. That is its job.
      - name: dependency audit (runtime, critical)
        working-directory: .
        run: npm audit --omit=dev --audit-level=critical
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Safe to build in CI: nothing in src/ reads process.env, so a missing key cannot fake a red.
      - run: npm run build
